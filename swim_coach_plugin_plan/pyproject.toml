[project]
name = "swim-coach"
version = "0.0.0"
description = "Plugin-first personal swimming coach"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16.4,<2",
  "asyncpg>=0.30,<1",
  "cryptography>=45,<51",
  "fastapi>=0.116,<1",
  "garmin-fit-sdk==21.208.0",
  "garminconnect[workout]==0.3.10",
  "httpx>=0.28,<1",
  "mcp>=1.13,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pyjwt[crypto]>=2.10,<3",
  "sqlalchemy>=2.0.43,<3",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "hypothesis>=6.138,<7",
  "jsonschema>=4.25,<5",
  "mypy>=1.17,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.1,<2",
  "pyyaml>=6.0,<7",
  "ruff>=0.12,<1",
  "testcontainers[postgres]>=4.12,<5",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/swim_coach"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["backend/tests", "tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend/src", "backend/tests", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**/*.py" = ["S101"]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "backend/src"
packages = ["swim_coach"]
