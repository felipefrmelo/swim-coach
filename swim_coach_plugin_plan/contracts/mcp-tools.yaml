schema_version: "2.0"
server:
  name: swim-coach
  transport: streamable-http
  path: /mcp
  auth: oauth-2.1
  scopes: [coach]
result_envelope: ./tool-result-envelope-v2.schema.json
tools:
  - name: get_coach_context
    title: Get swim coach context
    description: Return profile, timezone, goal, pools, explicit availability, constraints, recent deterministic training evidence, active plan, notes, Garmin health, and capabilities before prescribing.
    scopes: [coach]
    annotations: {readOnlyHint: true, destructiveHint: false, openWorldHint: false}
    input: {type: object, additionalProperties: false, properties: {include_constraints: {type: boolean, default: true}}}
  - name: propose_training_plan
    title: Validate a coach-authored training cycle
    description: Validate and stage a complete coach-authored training plan definition. This tool never generates or changes training content.
    scopes: [coach]
    annotations: {readOnlyHint: false, destructiveHint: false, openWorldHint: false}
    input:
      type: object
      additionalProperties: false
      required: [definition]
      properties:
        definition: {$ref: ./training-plan-definition.schema.json}
  - name: get_training_plan
    title: Get a training cycle
    description: Return the live or selected cycle, coach rationale, immutable revision history, session bindings, materialized workout definitions, reviews, and notes.
    scopes: [coach]
    annotations: {readOnlyHint: true, destructiveHint: false, openWorldHint: false}
    input:
      type: object
      additionalProperties: false
      properties:
        plan_id: {type: [string, "null"], format: uuid}
  - name: review_training_plan
    title: Review one plan week
    description: Return deterministic evidence for coach review. This tool never changes the plan or chooses a decision.
    scopes: [coach]
    annotations: {readOnlyHint: false, destructiveHint: false, openWorldHint: false}
    input:
      type: object
      additionalProperties: false
      required: [plan_id, week_number]
      properties:
        plan_id: {type: string, format: uuid}
        week_number: {type: integer, minimum: 1, maximum: 16}
  - name: propose_plan_revision
    title: Validate a coach-authored plan revision
    description: Validate and stage a coach-authored revision. This tool never chooses the adaptation decision or changes its prescription.
    scopes: [coach]
    annotations: {readOnlyHint: false, destructiveHint: false, openWorldHint: false}
    input:
      type: object
      additionalProperties: false
      required: [plan_id, expected_revision, revision_definition]
      properties:
        plan_id: {type: string, format: uuid}
        expected_revision: {type: integer, minimum: 1}
        revision_definition: {$ref: ./training-plan-revision-definition.schema.json}
  - name: apply_plan_revision
    title: Apply an approved plan revision
    description: Apply one exact proposed revision with optimistic concurrency, queue changed DETAILED weeks, and locally unschedule explicitly removed future sessions without changing Garmin.
    scopes: [coach]
    annotations: {readOnlyHint: false, destructiveHint: false, openWorldHint: false}
    input:
      type: object
      additionalProperties: false
      required: [plan_id, proposal_id, expected_revision, approval_hash]
      properties:
        plan_id: {type: string, format: uuid}
        proposal_id: {type: string, format: uuid}
        expected_revision: {type: integer, minimum: 0}
        approval_hash: {type: string, minLength: 64, maxLength: 64}
  - name: add_plan_note
    title: Add a structured plan note
    description: Attach bounded reusable context to a plan, week, session, or activity.
    scopes: [coach]
    annotations: {readOnlyHint: false, destructiveHint: false, openWorldHint: false}
    input:
      type: object
      additionalProperties: false
      required: [plan_id, scope_type, scope_ref, category, text]
      properties:
        plan_id: {type: string, format: uuid}
        scope_type: {type: string, enum: [PLAN, WEEK, SESSION, ACTIVITY]}
        scope_ref: {type: string, minLength: 1, maxLength: 255}
        category: {type: string, enum: [PERFORMANCE, TECHNIQUE, PAIN, RECOVERY, SCHEDULE, DECISION, DATA_QUALITY]}
        text: {type: string, minLength: 1, maxLength: 2000}
        author_type: {type: string, enum: [ATHLETE, COACH], default: ATHLETE}
        importance: {type: string, enum: [LOW, MEDIUM, HIGH], default: MEDIUM}
        affects_adaptation: {type: boolean, default: true}
        valid_from: {type: [string, "null"], format: date}
        valid_until: {type: [string, "null"], format: date}
        evidence_activity_ids:
          type: [array, "null"]
          items: {type: string, format: uuid}
  - name: set_training_plan_status
    title: Pause or resume a training cycle
    description: Explicitly pause or resume the selected plan without changing Garmin.
    scopes: [coach]
    annotations: {readOnlyHint: false, destructiveHint: false, openWorldHint: false}
    input:
      type: object
      additionalProperties: false
      required: [plan_id, status]
      properties:
        plan_id: {type: string, format: uuid}
        status: {type: string, enum: [ACTIVE, PAUSED]}
  - name: skip_plan_session
    title: Skip a plan session
    description: Resolve one uncompleted plan session as intentionally skipped.
    scopes: [coach]
    annotations: {readOnlyHint: false, destructiveHint: false, openWorldHint: false}
    input:
      type: object
      additionalProperties: false
      required: [plan_id, session_intent_id]
      properties:
        plan_id: {type: string, format: uuid}
        session_intent_id: {type: string, format: uuid}
  - name: get_workouts
    title: Get swim workouts
    description: Return one workout or the workouts for a day or week, including schedule, steps, revision, and Garmin status.
    scopes: [coach]
    annotations: {readOnlyHint: true, destructiveHint: false, openWorldHint: false}
    input:
      type: object
      additionalProperties: false
      properties:
        workout_id: {type: [string, "null"], format: uuid}
        date: {type: [string, "null"], format: date}
        week_start: {type: [string, "null"], format: date}
        include_steps: {type: boolean, default: true}
  - name: get_swims
    title: Get pool swims
    description: Return one analyzed pool swim or a concise recent list with data quality and planned-workout matching.
    scopes: [coach]
    annotations: {readOnlyHint: true, destructiveHint: false, openWorldHint: false}
    input:
      type: object
      additionalProperties: false
      properties:
        activity_id: {type: [string, "null"], format: uuid}
        limit: {type: integer, minimum: 1, maximum: 20, default: 5}
        include_intervals: {type: boolean, default: true}
  - name: save_workout
    title: Save and schedule a swim workout
    description: Create or edit a canonical pool workout and optionally schedule it locally in one call; the server manages revisions and concurrency.
    scopes: [coach]
    annotations: {readOnlyHint: false, destructiveHint: false, openWorldHint: false}
    input:
      type: object
      additionalProperties: false
      required: [definition]
      properties:
        workout_id: {type: [string, "null"], format: uuid}
        definition: {$ref: ./canonical-workout.schema.json}
        pool_id: {type: [string, "null"], format: uuid}
        scheduled_date: {type: [string, "null"], format: date}
        scheduled_start_time: {type: [string, "null"]}
        change_reason: {type: [string, "null"], maxLength: 500}
  - name: publish_workout
    title: Publish a swim workout to Garmin
    description: Create or update the Garmin workout and its calendar date idempotently; returns the operation state without exposing workflow internals.
    scopes: [coach]
    annotations: {readOnlyHint: false, destructiveHint: false, idempotentHint: true, openWorldHint: true}
    input:
      type: object
      additionalProperties: false
      required: [workout_id]
      properties:
        workout_id: {type: string, format: uuid}
        scheduled_date: {type: [string, "null"], format: date}
        scheduled_start_time: {type: [string, "null"]}
        target_device_id: {type: [string, "null"], format: uuid}
  - name: delete_workout
    title: Delete a swim workout everywhere
    description: Remove a planned workout, its local calendar entry, Garmin schedule, and Garmin workout template; completed or activity-matched workouts are protected.
    scopes: [coach]
    annotations: {readOnlyHint: false, destructiveHint: true, idempotentHint: true, openWorldHint: true}
    input:
      type: object
      additionalProperties: false
      required: [workout_id]
      properties:
        workout_id: {type: string, format: uuid}
  - name: materialize_plan_week
    title: Materialize an approved plan week
    description: Idempotently create local workouts from an approved DETAILED week without generating content or publishing to Garmin.
    scopes: [coach]
    annotations: {readOnlyHint: false, destructiveHint: false, openWorldHint: false}
    input:
      type: object
      additionalProperties: false
      required: [plan_id, expected_revision, week_number]
      properties:
        plan_id: {type: string, format: uuid}
        expected_revision: {type: integer, minimum: 1}
        week_number: {type: integer, minimum: 1, maximum: 16}
  - name: sync_garmin
    title: Sync Garmin activities
    description: Queue an idempotent Garmin activity sync and return its current job state.
    scopes: [coach]
    annotations: {readOnlyHint: false, destructiveHint: false, idempotentHint: true, openWorldHint: true}
    input: {type: object, additionalProperties: false, properties: {from_date: {type: [string, "null"], format: date}, force: {type: boolean, default: false}}}
  - name: save_feedback
    title: Save post-swim feedback
    description: Store optional field-level overrides or manual technique, pain, and notes for a pool swim; Garmin FIT effort may remain effective when RPE is omitted.
    scopes: [coach]
    annotations: {readOnlyHint: false, destructiveHint: false, openWorldHint: false}
    input:
      type: object
      additionalProperties: false
      required: [activity_id]
      properties:
        activity_id: {type: string, format: uuid}
        rpe: {type: integer, minimum: 1, maximum: 10}
        feeling_score: {type: integer, minimum: 0, maximum: 100}
        technique: {type: [string, "null"]}
        pain_present: {type: boolean, default: false}
        pain_location: {type: [string, "null"], maxLength: 120}
        pain_intensity: {type: [integer, "null"], minimum: 1, maximum: 10}
        notes: {type: [string, "null"], maxLength: 2000}
