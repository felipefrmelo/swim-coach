schema_version: "2.0"
plugin_releases:
  - {phase: P00, version: 0.0.0-spike, mode: skills-only-or-test-connection, purpose: platform feasibility}
  - {phase: P06, version: 0.1.0, mode: read-only, purpose: historical read workflows}
  - {phase: P08, version: 0.2.0, mode: controlled-write, purpose: historical proposal workflow}
  - {phase: P09, version: 0.3.0, mode: optional-ui, purpose: historical MCP Apps UI}
  - {phase: P10, version: 0.4.0, mode: adaptive-planning, purpose: historical weekly proposal}
  - {phase: P12, version: 1.0.0, mode: hardened-personal-release, purpose: operational personal product}
  - phase: P13
    version: 2.0.0
    mode: chatgpt-first-direct-commands
    purpose: personal coach with eight intent-level tools and direct Garmin upsert
    oauth_scopes: [coach]
  - phase: P14
    version: 2.1.0
    mode: direct-delete-everywhere
    purpose: immediate local removal with idempotent Garmin cleanup
    oauth_scopes: [coach]
  - phase: P15
    version: 3.0.0
    mode: approval-gated-training-cycles
    purpose: coach-authored rolling cycles with deterministic validation, evidence, and stable feedback identity
    oauth_scopes: [coach]

tools:
  - {name: get_coach_context, introduced: P13, release: 2.0.0, kind: read, external_effect: false}
  - {name: get_workouts, introduced: P13, release: 2.0.0, kind: read, external_effect: false}
  - {name: get_swims, introduced: P13, release: 2.0.0, kind: read, external_effect: false}
  - {name: save_workout, introduced: P13, release: 2.0.0, kind: local-write, external_effect: false}
  - {name: publish_workout, introduced: P13, release: 2.0.0, kind: external-write-upsert, external_effect: true}
  - {name: materialize_plan_week, introduced: P15, release: 3.0.0, kind: approved-local-write, external_effect: false}
  - {name: sync_garmin, introduced: P13, release: 2.0.0, kind: external-read, external_effect: true}
  - {name: save_feedback, introduced: P13, release: 2.0.0, kind: local-write, external_effect: false}
  - {name: delete_workout, introduced: P14, release: 2.1.0, kind: destructive-external-write, external_effect: true}
  - {name: propose_training_plan, introduced: P15, release: 3.0.0, kind: local-write-proposal, external_effect: false}
  - {name: get_training_plan, introduced: P15, release: 3.0.0, kind: read, external_effect: false}
  - {name: review_training_plan, introduced: P15, release: 3.0.0, kind: local-write-snapshot, external_effect: false}
  - {name: propose_plan_revision, introduced: P15, release: 3.0.0, kind: local-write-proposal, external_effect: false}
  - {name: apply_plan_revision, introduced: P15, release: 3.0.0, kind: approved-local-write, external_effect: false}
  - {name: add_plan_note, introduced: P15, release: 3.0.0, kind: local-write, external_effect: false}
  - {name: set_training_plan_status, introduced: P15, release: 3.0.0, kind: local-write, external_effect: false}
  - {name: skip_plan_session, introduced: P15, release: 3.0.0, kind: local-write, external_effect: false}

skills:
  - name: review-latest-swim
    introduced: P13
    release: 2.0.0
    required_tools: [get_swims, get_coach_context]
  - name: goal-progress
    introduced: P13
    release: 2.0.0
    required_tools: [get_coach_context]
  - name: diagnose-sync
    introduced: P13
    release: 2.0.0
    required_tools: [get_coach_context, sync_garmin, get_swims]
  - name: adapt-workout
    introduced: P13
    release: 2.0.0
    required_tools: [get_coach_context, get_workouts, save_workout, publish_workout]
  - name: publish-to-garmin
    introduced: P13
    release: 2.0.0
    required_tools: [get_workouts, save_workout, publish_workout]
  - name: post-swim-checkin
    introduced: P13
    release: 2.0.0
    required_tools: [get_swims, save_feedback]
  - name: plan-swim-week
    introduced: P15
    release: 3.0.0
    required_tools: [get_coach_context, get_workouts, get_swims, propose_training_plan, get_training_plan, review_training_plan, propose_plan_revision, apply_plan_revision, add_plan_note, set_training_plan_status, skip_plan_session, materialize_plan_week, publish_workout]
  - name: delete-workout
    introduced: P14
    release: 2.1.0
    required_tools: [get_workouts, delete_workout]

ui_resources: []

legacy:
  status: retained-in-code-for-transition-not-advertised
  retired_in: P13
  notes: P00-P10 tool and UI contracts remain in history and legacy tests only.
