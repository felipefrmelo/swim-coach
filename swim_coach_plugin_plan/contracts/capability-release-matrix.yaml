schema_version: "2.0"
plugin_releases:
  - {phase: P00, version: 0.0.0-spike, mode: skills-only-or-test-connection, purpose: platform feasibility}
  - {phase: P06, version: 0.1.0, mode: read-only, purpose: historical read workflows}
  - {phase: P08, version: 0.2.0, mode: controlled-write, purpose: historical proposal workflow}
  - {phase: P09, version: 0.3.0, mode: optional-ui, purpose: historical MCP Apps UI}
  - {phase: P10, version: 0.4.0, mode: adaptive-planning, purpose: historical weekly proposal}
  - {phase: P12, version: 1.0.0, mode: hardened-personal-release, purpose: operational personal product}
  - phase: P13
    version: 2.0.0
    mode: chatgpt-first-direct-commands
    purpose: personal coach with eight intent-level tools and direct Garmin upsert
    oauth_scopes: [coach]

tools:
  - {name: get_coach_context, introduced: P13, release: 2.0.0, kind: read, external_effect: false}
  - {name: get_workouts, introduced: P13, release: 2.0.0, kind: read, external_effect: false}
  - {name: get_swims, introduced: P13, release: 2.0.0, kind: read, external_effect: false}
  - {name: save_workout, introduced: P13, release: 2.0.0, kind: local-write, external_effect: false}
  - {name: publish_workout, introduced: P13, release: 2.0.0, kind: external-write-upsert, external_effect: true}
  - {name: generate_week, introduced: P13, release: 2.0.0, kind: local-write, external_effect: false}
  - {name: sync_garmin, introduced: P13, release: 2.0.0, kind: external-read, external_effect: true}
  - {name: save_feedback, introduced: P13, release: 2.0.0, kind: local-write, external_effect: false}

skills:
  - name: review-latest-swim
    introduced: P13
    release: 2.0.0
    required_tools: [get_swims, get_coach_context]
  - name: goal-progress
    introduced: P13
    release: 2.0.0
    required_tools: [get_coach_context]
  - name: diagnose-sync
    introduced: P13
    release: 2.0.0
    required_tools: [get_coach_context, sync_garmin, get_swims]
  - name: adapt-workout
    introduced: P13
    release: 2.0.0
    required_tools: [get_coach_context, get_workouts, save_workout, publish_workout]
  - name: publish-to-garmin
    introduced: P13
    release: 2.0.0
    required_tools: [get_workouts, save_workout, publish_workout]
  - name: post-swim-checkin
    introduced: P13
    release: 2.0.0
    required_tools: [get_swims, save_feedback]
  - name: plan-swim-week
    introduced: P13
    release: 2.0.0
    required_tools: [get_coach_context, get_workouts, get_swims, generate_week, publish_workout]

ui_resources: []

legacy:
  status: retained-in-code-for-transition-not-advertised
  retired_in: P13
  notes: P00-P10 tool and UI contracts remain in history and legacy tests only.
