id: review_latest_swim_stale
skill: review-latest-swim
description: Explica staleness antes de concluir que não há atividade.
user_turns:
- Meu treino de ontem não apareceu. Como eu fui?
fixtures:
  recent_swims: empty
  sync_status: stale
expect:
  allowed_tools:
  - list_recent_swims
  - get_sync_status
  forbidden_tools:
  - execute_approved_action
  response_contains:
  - stale
  - sync
  requires_confirmation: false
