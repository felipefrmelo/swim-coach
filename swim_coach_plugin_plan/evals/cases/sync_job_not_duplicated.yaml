id: sync_job_not_duplicated
skill: diagnose-sync
description: Acompanha job existente em vez de iniciar outro.
user_turns:
- Sincroniza de novo, acho que travou.
fixtures:
  sync_status: job_running
expect:
  tool_sequence:
  - get_sync_status
  - get_job_status
  forbidden_tools:
  - sync_garmin_activities
  - retry_failed_job
  response_contains:
  - job_running
  requires_confirmation: false
